# CI — mirrors the pre-PR commands documented in AGENTS.md § "Validation and tests".
#
# AGENTS.md has always cited this file as the source of truth for those commands,
# but it did not exist on disk until 2026-11-04 — which is how the repo accumulated
# 79 dependency advisories (incl. one critical) unnoticed. See
# docs/status/dependency-vulnerability-spec.md § 6.
#
# Everything here runs OFFLINE. No AWS credentials, no Atlas, no Bedrock:
#   - validate:agentcore   only constructs a client; live ListSessions is opt-in
#                          via AGENTCORE_MEMORY_ID / AGENTCORE_ACTOR_ID.
#   - validate:multi-classifier forces CLASSIFIER_BACKEND=heuristic (no Bedrock spend).
# Live-AWS checks stay in e2e-smoke/ and run from deploy-project.sh Phase 11.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: deliberately NOT setting METRICS_EMITTER_ENABLED=0 here, despite
# AGENTS.md § Strands/Bedrock touchpoints suggesting it for CI. That guidance
# is for running the *app*; applying it to the test suite breaks 13 unit tests
# in cw-metrics.test.ts / long-term-memory / chat-mirror that assert metrics ARE
# emitted (verified: 540 pass with the emitter on, 527 pass + 13 fail with it off).
# The emitter writes EMF lines to stdout, which is noise in logs but not a failure.

jobs:
  api:
    name: api — typecheck, validate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - name: validate:bun
        run: bun run validate:bun
      - name: validate:agentcore
        run: bun run validate:agentcore
      - name: validate:strands-otel
        run: bun run validate:strands-otel
      - name: validate:strands-retries
        run: bun run validate:strands-retries
      - name: validate:strands-tools
        run: bun run validate:strands-tools
      - name: validate:multi-classifier
        run: bun run validate:multi-classifier

      # Unit only. test:integration is env-gated (needs live Mongo/Bedrock).
      - run: bun run test

  mcp-runtime:
    name: mongodb-mcp — typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-runtimes/mongodb-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-runtimes/mongodb-mcp/package-lock.json

      # `npm ci` (not `install`) so package-lock.json is authoritative — this
      # workspace's lockfile was previously only ever exercised by the Docker build.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  ui:
    name: ui — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ui/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Gate at `high`. Moderates stay advisory until the Wave 3 backlog in
      # docs/status/dependency-vulnerability-spec.md § 3 is cleared.
      #
      # Two high advisories are ignored by ID. BOTH are unreachable in this repo
      # and BOTH are held down by the Strands 0.7 <-> OTel 1.x peer matrix that
      # api/ pins deliberately (AGENTS.md § Strands/Bedrock touchpoints):
      #   GHSA-45rx-2jwx-cxfr  @opentelemetry/propagator-jaeger — we propagate
      #                        W3C traceparent only; the Jaeger propagator is never used.
      #   GHSA-4v6f-7vjh-6x4m  @strands-agents/sdk A2A server — never started here.
      # DELETE BOTH IGNORES when Wave 3 lands. If either package shows up with a
      # *different* advisory ID, this gate still fails — which is the point.
      - name: audit api
        working-directory: api
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high \
            --ignore=GHSA-45rx-2jwx-cxfr \
            --ignore=GHSA-4v6f-7vjh-6x4m

      - name: audit db-seeding
        working-directory: db-seeding
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high

      - name: audit e2e
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high

      - name: audit mongodb-mcp
        working-directory: mcp-runtimes/mongodb-mcp
        run: |
          npm ci
          npm audit --audit-level=high

      - name: audit ui (python)
        working-directory: ui
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
