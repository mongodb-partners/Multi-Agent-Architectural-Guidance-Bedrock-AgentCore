# Dependabot — see docs/status/dependency-vulnerability-spec.md § 6.
#
# Nothing automated watched these manifests until 2026-11-04, which is how the
# repo reached 79 advisories including a critical. Weekly cadence, grouped so a
# normal week is one or two PRs rather than thirty.
#
# NOTE on the two ecosystems: api/, db-seeding/ and e2e/ are Bun workspaces
# (bun.lock). Dependabot has no Bun lockfile support, so it updates package.json
# and the bun.lock is regenerated by `bun install` — re-run it locally on the
# PR branch before merging if the lockfile matters for that change.

version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
      opentelemetry:
        # OTel must move as a set, and in lockstep with @strands-agents/sdk —
        # see spec § 3 Wave 3. Review these together, never piecemeal.
        patterns: ["@opentelemetry/*"]
      dev-tooling:
        patterns: ["typescript", "esbuild", "@types/*"]

  - package-ecosystem: npm
    directory: /mcp-runtimes/mongodb-mcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      dev-tooling:
        patterns: ["typescript", "@types/*"]

  - package-ecosystem: npm
    directory: /db-seeding
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        # ui/requirements.txt documents the intended lockstep with the Bun-side
        # OTel pin in api/package.json — keep these moving together.
        patterns: ["opentelemetry-*"]

  # Base images: oven/bun:1 (api), python:3.13-slim-bookworm (ui),
  # node:22.23.4-alpine (mongodb-mcp — pinned for INFOSEC-122760 F4, so
  # Dependabot is what moves that pin forward rather than it silently rotting).
  - package-ecosystem: docker
    directories:
      - /api
      - /ui
      - /mcp-runtimes/mongodb-mcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
